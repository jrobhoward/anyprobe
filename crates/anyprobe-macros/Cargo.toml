[package]
name = "anyprobe-macros"
version = "0.9.0"
description = "Procedural macros for anyprobe; use them through the anyprobe crate"
keywords = ["tracing", "usdt", "dtrace", "bpftrace", "etw"]
readme = "README.md"
categories = ["development-tools::debugging", "development-tools::profiling"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
# Compile-fail tests for every input the macro rejects. They expand through
# the `anyprobe` facade, as users do. Default features off, so that
# `--no-default-features` on the workspace builds anyprobe without them.
anyprobe = { path = "../anyprobe", default-features = false }
trybuild = "1"
