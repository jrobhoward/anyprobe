[package]
name = "anyprobe"
version = "0.9.0"
description = "USDT-style probes for Rust: SystemTap SDT on Linux, DTrace on macOS and FreeBSD, ETW on Windows"
keywords = ["tracing", "usdt", "dtrace", "bpftrace", "etw"]
readme = "../../README.md"
categories = ["development-tools::debugging", "development-tools::profiling"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-pc-windows-msvc",
]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[features]
default = ["serde"]
# `serde(...)` encoding in `#[probe]`, as JSON.
serde = ["dep:serde", "dep:serde_json"]
# Arguments `#[probe]` does not list pick `Serialize`, then `Debug`. Implies
# `serde`: with `serde` optional, a second crate enabling it would switch an
# argument from `Debug` to JSON, so the order would depend on the build graph.
autoref = ["serde"]

[dependencies]
# Exact: generated code calls `anyprobe::__private`, which is not covered by
# semver, so the macro and the runtime are released in lockstep.
anyprobe-macros = { version = "=0.9.0", path = "../anyprobe-macros" }
serde = { version = "1.0.200", optional = true, default-features = false, features = ["std"] }
serde_json = { version = "1.0.120", optional = true, default-features = false, features = ["std"] }
thiserror = "2.0.12"
# The registry parser checks function and argument names against Rust's
# identifier rules. Already in every build graph through `proc-macro2`.
unicode-ident = "1"

# Microsoft's TraceLogging without macros. The `tracelogging` crate's macros
# expand to `::tracelogging::...` paths, which would make every user add it as
# a direct dependency.
[target.'cfg(windows)'.dependencies]
tracelogging_dynamic = "1.2"

# FreeBSD registers probes at runtime: the site table is turned into DOF and
# handed to the kernel through `/dev/dtrace/helper`.
[target.'cfg(all(target_os = "freebsd", target_arch = "x86_64"))'.dependencies]
dof = { version = "0.4", default-features = false }
libc = "0.2.150"

[dev-dependencies]
# The FreeBSD site table parser is plain data processing, so its tests run on
# every host.
dof = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
# Compile-fail tests whose result depends on this crate's features, which
# trybuild forwards only for the crate under test.
trybuild = "1"

[[example]]
name = "attr"
required-features = ["serde"]
