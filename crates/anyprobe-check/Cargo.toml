[package]
name = "anyprobe-check"
version = "0.0.0"
description = "One probe per argument kind, so `cargo build --lib --target ...` reaches every backend's codegen without a linker"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

# Mirrors anyprobe's features, so `--no-default-features` and `--features
# autoref` on the workspace reach anyprobe rather than being undone here.
[features]
default = ["serde"]
serde = ["anyprobe/serde"]
autoref = ["anyprobe/autoref"]

[dependencies]
anyprobe = { path = "../anyprobe", default-features = false }
