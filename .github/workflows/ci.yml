name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The advisory database changes without any commit here, so the security
  # audit needs a clock as well as a push to trigger it.
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

# RUSTFLAGS=-Dwarnings is not set here: it would apply to dependency
# compilation too, so a new stable rustc adding one warning anywhere in the
# graph would red every job with no anyprobe changes. Every lint gate passes
# `-Dwarnings` to `cargo clippy` explicitly instead. See CLAUDE.md.

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -Dwarnings
      # The other feature sets. Code under `cfg(feature)` is only compiled
      # where it is enabled, and the compile-fail tests in
      # `crates/anyprobe/tests/ui/` pick their cases by feature.
      - run: cargo clippy --workspace --all-targets --no-default-features -- -Dwarnings
      - run: cargo clippy --workspace --all-targets --features autoref -- -Dwarnings
      - run: cargo test --workspace --no-default-features
      - run: cargo test --workspace --features autoref
      # Scoped to this step: a broken intra-doc link should fail, a warning
      # inside a dependency should not.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  cross-check:
    name: cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-apple-darwin, x86_64-unknown-freebsd, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      # `--all-targets` so the `cfg`-gated `*_tests.rs` files compile too.
      - name: Clippy per target
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin \
                   x86_64-apple-darwin x86_64-unknown-freebsd x86_64-pc-windows-msvc \
                   aarch64-pc-windows-msvc; do
            cargo clippy --workspace --target $t --all-targets -- -Dwarnings
          done
      # `check` and `clippy` stop before codegen and never assemble an `asm!`
      # template. `build --lib` reaches codegen and needs no linker.
      - name: Codegen per target
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin \
                   x86_64-apple-darwin x86_64-unknown-freebsd x86_64-pc-windows-msvc \
                   aarch64-pc-windows-msvc; do
            cargo build -p anyprobe-check -p anyprobe-spike --lib --release --target $t
          done
      # `--cfg anyprobe_dylib` swaps the Linux semaphore load for a plain Rust
      # load. Step-scoped: it holds a cfg only, never `-Dwarnings`.
      - name: Linux dylib opt-out
        env:
          RUSTFLAGS: --cfg anyprobe_dylib
        run: |
          set -euo pipefail
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo clippy --workspace --target $t --all-targets -- -Dwarnings
            cargo build -p anyprobe-check -p anyprobe-spike --lib --release --target $t
          done
      # `--cfg anyprobe_noop` selects the no-op backend on every target. Tests
      # run on the host; every target is checked, since each one gates its
      # backend on the cfg. Step-scoped, like the step above.
      - name: No-op opt-out
        env:
          RUSTFLAGS: --cfg anyprobe_noop
        run: |
          set -euo pipefail
          cargo test --workspace --target-dir target/cfg-noop
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin \
                   x86_64-apple-darwin x86_64-unknown-freebsd x86_64-pc-windows-msvc \
                   aarch64-pc-windows-msvc; do
            cargo clippy --workspace --target $t --all-targets --target-dir target/cfg-noop -- -Dwarnings
          done

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace

  # Compile-fail cases whose expected output is rustc's own wording. They are
  # `#[ignore]`d everywhere else, so a new stable rustc cannot redden the
  # other jobs. Moving the pin means re-blessing these cases in the same PR
  # (see CLAUDE.md).
  ui-rustc:
    name: UI tests (rustc 1.99.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test --locked -p anyprobe-macros --test ui_rustc -- --ignored
      - run: cargo test --locked -p anyprobe --test ui_rustc -- --ignored
      - run: cargo test --locked -p anyprobe --features autoref --test ui_rustc -- --ignored

  licenses:
    name: licence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Separate from the licence job so a new advisory is reported as its own
  # failure rather than reading as a licence problem.
  advisories:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
      # `Cargo.lock` pins every other job. This one resolves fresh, which is
      # where an upstream release this workspace cannot build against shows up.
      - name: Build against freshly resolved dependencies
        run: |
          set -euo pipefail
          cargo update
          cargo check --workspace --all-targets

  # Catches a packaging problem (a missing file, an unpublishable path
  # dependency) before a release rather than after one.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked --dry-run -p anyprobe-macros -p anyprobe -p cargo-anyprobe

  # Compares the public API against the newest release on crates.io. Nothing
  # is published yet, so it reports that and passes until the first release.
  semver:
    name: semver compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: baseline
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: anyprobe-ci' https://crates.io/api/v1/crates/anyprobe)
          if [ "$code" = "404" ]; then
            echo "::notice::anyprobe is not published yet, so there is no baseline to compare against."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io returned HTTP $code; cannot tell whether a baseline exists"
            exit 1
          fi
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        if: steps.baseline.outputs.exists == 'true'
        with:
          package: anyprobe

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Attach bpftrace to the running program. Passing means: the semaphore
  # flipped inside the process when bpftrace attached and back when it
  # detached, and bpftrace read the arguments from every site. `crate` picks
  # the spike or the anyprobe crate's `work` example (same probes); the
  # anyprobe rows also check `#[probe]` with the `attr` and `attr_async`
  # examples (`async fn`, `unwind`, and `symbol` through a uprobe), and the
  # bpftrace scripts `cargo anyprobe` writes for them.
  spike-linux:
    name: attach / ${{ matrix.crate }} / ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        crate: [spike, anyprobe]
        os: [ubuntu-latest, ubuntu-24.04-arm]
        profile: [release, release-lto]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y bpftrace
      - name: Attach bpftrace
        run: bash spike/scripts/attach-linux.sh ${{ matrix.profile }}
        env:
          ATTACH_CRATE: ${{ matrix.crate }}
      # `#[probe]`: every encoding, `async fn`, `unwind` and `symbol`, read
      # back by bpftrace.
      - name: Attach bpftrace to #[probe]
        if: matrix.crate == 'anyprobe'
        run: bash spike/scripts/attach-linux-attr.sh ${{ matrix.profile }}

  # GitHub's macOS runners have SIP on, so dtrace may be refused. What must
  # hold regardless, for both architectures: ld64 built DOF with every
  # expected site, rewrote every site, and no site ends its function (a tail
  # call there would fall through into the next function once rewritten).
  # `inspect_dof` checks all of it and fails on any bad site.
  spike-macos:
    name: attach / ${{ matrix.crate }} / macos / ${{ matrix.target }} / ${{ matrix.profile }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [spike, anyprobe]
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
        profile: [release, release-lto]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the DOF ld64 built
        run: spike/scripts/attach-macos.sh ${{ matrix.profile }}
        env:
          ATTACH_CRATE: ${{ matrix.crate }}
          SPIKE_TARGET: ${{ matrix.target }}
          SPIKE_ATTACH: "0"
      # Works with SIP on for this binary on a local Apple Silicon Mac;
      # whether the hosted runner allows it is what this step reports.
      - name: Attach dtrace (informational)
        if: matrix.target == 'aarch64-apple-darwin'
        continue-on-error: true
        run: spike/scripts/attach-macos.sh ${{ matrix.profile }}
        env:
          ATTACH_CRATE: ${{ matrix.crate }}
      # `#[probe]` (the `attr` and `same_name` examples), once per target and
      # profile: the anyprobe rows only, since the spike has no attribute.
      - name: Check the DOF ld64 built for #[probe]
        if: matrix.crate == 'anyprobe'
        run: spike/scripts/attach-macos-attr.sh ${{ matrix.profile }}
        env:
          SPIKE_TARGET: ${{ matrix.target }}
          SPIKE_ATTACH: "0"
      - name: Attach dtrace to #[probe] (informational)
        if: matrix.crate == 'anyprobe' && matrix.target == 'aarch64-apple-darwin'
        continue-on-error: true
        run: spike/scripts/attach-macos-attr.sh ${{ matrix.profile }}

  # Start an ETW session against the provider GUID the spike prints. Passing
  # means the provider saw the session (the process logged
  # entry-enabled=true) and the session captured events.
  spike-windows:
    name: attach / ${{ matrix.crate }} / ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        crate: [spike, anyprobe]
        profile: [release, release-lto]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Attach an ETW session
        run: ./spike/scripts/attach-windows.ps1 -Profiles ${{ matrix.profile }}
        env:
          ATTACH_CRATE: ${{ matrix.crate }}
      # `#[probe]`: every encoding decoded from the trace.
      - name: Attach an ETW session to #[probe]
        if: matrix.crate == 'anyprobe'
        run: ./spike/scripts/attach-windows-attr.ps1 -Profiles ${{ matrix.profile }}

  # FreeBSD in a VM, as root, so dtrace runs for real: the workspace tests,
  # then the attach scripts for the spike, the anyprobe `work` example and
  # `#[probe]`. The scripts are POSIX sh, since FreeBSD has no bash.
  freebsd:
    name: freebsd (test + dtrace attach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -eu
            . "$HOME/.cargo/env"
            cargo test --workspace --locked
            sh spike/scripts/attach-freebsd.sh
            ATTACH_CRATE=anyprobe sh spike/scripts/attach-freebsd.sh
            sh spike/scripts/attach-freebsd-attr.sh

  # Informational: the disabled cost on each runner. Shared runners are noisy,
  # so this reports and never fails the build.
  spike-bench:
    name: spike bench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench -p anyprobe-spike --bench disabled_cost -- --warm-up-time 2 --measurement-time 5
      - run: cargo bench -p anyprobe --bench disabled_cost -- --warm-up-time 2 --measurement-time 5
